[project]
name = "orchestrate"
version = "0.1.0"
description = "Message Notification Router - HackerRank Orchestrate August 2026"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.51.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
    "tenacity>=9.0.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["code"]

[tool.setuptools.packages.find]
where = ["code"]
